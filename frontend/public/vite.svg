<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Gradient for outer circle -->
    <linearGradient id="aiGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <!-- Gradient for nodes -->
    <linearGradient id="aiGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="128" cy="128" r="120" fill="#0F172A"/>

  <!-- Processing Ring -->
  <circle cx="128" cy="128" r="60" stroke="url(#aiGradient1)" stroke-width="10"/>

  <!-- AI Core -->
  <circle cx="128" cy="128" r="12" fill="url(#aiGradient2)"/>

  <!-- Nodes -->
  <circle cx="128" cy="70" r="6" fill="url(#aiGradient2)"/>
  <circle cx="128" cy="186" r="6" fill="url(#aiGradient2)"/>
  <circle cx="70" cy="128" r="6" fill="url(#aiGradient2)"/>
  <circle cx="186" cy="128" r="6" fill="url(#aiGradient2)"/>

  <!-- Connecting Lines -->
  <path d="M128 82 L128 116" stroke="url(#aiGradient2)" stroke-width="4"/>
  <path d="M128 140 L128 174" stroke="url(#aiGradient2)" stroke-width="4"/>
  <path d="M82 128 L116 128" stroke="url(#aiGradient2)" stroke-width="4"/>
  <path d="M140 128 L174 128" stroke="url(#aiGradient2)" stroke-width="4"/>
</svg>
