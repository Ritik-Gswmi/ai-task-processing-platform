
services:

  frontend:
    build: ../../frontend
    container_name: ai-task-processing-platform-frontend
    ports:
      - "3000:8080"                 # Expose the Nginx container on port 3000
    restart: always
    depends_on:
      - backend
    networks:
      - ai-task-processing-platform-network

  backend:
    build: ../../backend
    container_name: ai-task-processing-platform-backend
    ports:
      - "5000:5000"
    env_file:
      - ../../backend/.env.docker
    restart: always
    networks:
      - ai-task-processing-platform-network
    depends_on:
      - mongodb
      - redis

  worker:
    build: ../../worker
    container_name: ai-task-processing-platform-worker
    env_file:
      - ../../worker/.env
    restart: always
    depends_on:
      - backend
      - redis
      - mongodb
    networks:
      - ai-task-processing-platform-network

  mongodb:
    image: mongo:6
    container_name: ai-task-processing-platform-mongodb
    ports:
      - "27017:27017"
    networks:
      - ai-task-processing-platform-network
    restart: always
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7
    container_name: ai-task-processing-platform-redis
    ports:
      - "6379:6379"
    networks:
      - ai-task-processing-platform-network
    restart: always

networks:
  ai-task-processing-platform-network:
    external: true

volumes:
  mongo-data:
