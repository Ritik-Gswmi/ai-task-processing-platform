apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Ingress
      name: ai-task-processing-platform-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.ai-task-processing-platform.local
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

images:
  - name: ritik799/ai-task-processing-platform-frontend
    newName: ritik799/ai-task-processing-platform-frontend
    newTag: 9ae9053
  - name: ritik799/ai-task-processing-platform-backend
    newName: ritik799/ai-task-processing-platform-backend
    newTag: 9ae9053
  - name: ritik799/ai-task-processing-platform-worker
    newName: ritik799/ai-task-processing-platform-worker
    newTag: 9ae9053